{% extends "base.html" %}
{% block title %}我的订单 - 终极商城{% endblock %}
{% block content %}
<div class="card">
  <h1>我的订单</h1>
  <p class="muted">这里只显示<strong>你自己账号</strong>的订单（按登录用户过滤），不是全站订单。</p>
  <div id="me-box" class="muted">请先登录</div>
  <table class="orders" id="orders-table" style="display:none">
    <thead><tr><th>商品</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
    <tbody id="orders-body"></tbody>
  </table>
</div>
{% endblock %}
